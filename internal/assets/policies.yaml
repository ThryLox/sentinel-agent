version: 1
policies:
  - id: "critical-threats"
    name: "Critical Threat Protection"
    rules:
      - id: "block-mimikatz"
        type: "block_process"
        match: "mimikatz.exe"
        action: "alert"
      - id: "block-procdump"
        type: "block_process"
        match: "procdump.exe"
        action: "alert"
      - id: "block-cobalt-strike"
        type: "block_process"
        match: "beacon.exe"
        action: "alert"
      - id: "block-metasploit"
        type: "block_process"
        match: "meterpreter.exe"
        action: "alert"
      - id: "block-calculator"
        type: "block_process"
        match: "CalculatorApp.exe"
        action: "alert"
      - id: "block-cmd"
        type: "block_process"
        match: "cmd.exe"
        action: "alert"
      - id: "block-powershell"
        type: "block_process"
        match: "powershell.exe"
        action: "alert"

  - id: "suspicious-tools"
    name: "Suspicious Tool Restrictions"
    rules:
      - id: "detect-nmap"
        type: "block_process"
        match: "nmap.exe"
        action: "alert"
      - id: "detect-wireshark"
        type: "block_process"
        match: "wireshark.exe"
        action: "alert"
      - id: "detect-ps-ise"
        type: "block_process"
        match: "powershell_ise.exe"
        action: "alert"
      - id: "detect-psexec"
        type: "block_process"
        match: "psexec.exe"
        action: "alert"
      - id: "detect-netcat"
        type: "block_process"
        match: "nc.exe"
        action: "alert"

  - id: "ransomware-precursors"
    name: "Ransomware Precursor Detection"
    rules:
      - id: "detect-vssadmin"
        type: "block_process"
        match: "vssadmin.exe"
        action: "alert"
      - id: "detect-cipher"
        type: "block_process"
        match: "cipher.exe"
        action: "alert"

  - id: "device-controls"
    name: "Device Controls"
    rules:
      - id: "detect-usb-storage"
        type: "detect_usb"
        action: "alert"

  - id: "test-policy"
    name: "Test Policy (Verification)"
    rules:
      - id: "block-notepad"
        type: "block_process"
        match: "notepad.exe"
        action: "alert"
      - id: "block-calc"
        type: "block_process"
        match: "calc.exe"
        action: "alert"
      - id: "block-mspaint"
        type: "block_process"
        match: "mspaint.exe"
        action: "alert"
